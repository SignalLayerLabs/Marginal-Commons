[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marginal-commons"
version = "0.1.0"
description = "Closed-schema, model-specific aggregate priors for MARGINAL"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["tests/test_contract.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tooling", "validation"]
